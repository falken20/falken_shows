steps:
  # ── Backend: Lint + Test ──────────────────────────────────────
  - name: "python:3.11-slim"
    id: backend-test
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        pip install uv -q
        uv sync
        uv run ruff check app tests
        uv run pytest --cov=app --cov-fail-under=80

  # ── Build backend Docker image ────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-backend
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest"
      - ./backend
    waitFor: [backend-test]

  # ── Build frontend Docker image ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-frontend
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest"
      - --build-arg
      - "VITE_API_BASE_URL=${_BACKEND_URL}/api/v1"
      - ./frontend

  # ── Push backend image ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-backend
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend"
    waitFor: [build-backend]

  # ── Push frontend image ───────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-frontend
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend"
    waitFor: [build-frontend]

  # ── Run Alembic migrations ────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - live-memories-migrations
      - --region=${_REGION}
      - --wait
    waitFor: [push-backend]

  # ── Deploy backend ────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - live-memories-backend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
    waitFor: [run-migrations]

  # ── Deploy frontend ───────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - live-memories-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
    waitFor: [push-frontend]

substitutions:
  _REGION: europe-west1
  _REPO: live-memories
  _BACKEND_URL: https://live-memories-backend-xxxx-ew.a.run.app

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
